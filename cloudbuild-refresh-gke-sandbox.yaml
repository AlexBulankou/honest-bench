# Refresh the gke-sandbox (gVisor) honest-benchmark headline — MANUAL Cloud Build
# trigger (GHA->CB migration; replaces .github/workflows/refresh-gke-sandbox.yml).
#
# Fleet rule: NO GitHub Actions — Cloud Build ONLY. "Spend-arm" is now the
# trigger's invocation policy: this config binds to a MANUAL trigger (no
# branch/PR/schedule wiring), so a real gVisor GKE cluster is never spun
# unattended. Fire it by hand:
#   gcloud builds triggers run hb-refresh-gke-sandbox --project=<PROJECT> \
#     --substitutions=_POOL_REPLICAS=10,_MACHINE_TYPE=n2-standard-16,_REGION=us-central1
#
# hb#379 ONE-OFF SWEEP (warmpool_cold_start pool-capacity diagnostic): override
# _WARMPOOL_POOL_REPLICAS/_WARMPOOL_CLAIM_COUNT (default 30/40, the committed
# published shape) without editing this file, e.g.:
#   gcloud builds triggers run hb-refresh-gke-sandbox --project=<PROJECT> \
#     --substitutions=_WARMPOOL_POOL_REPLICAS=10,_WARMPOOL_CLAIM_COUNT=10
# A value below 30 will trip check_n_regression on publish — add
# BENCH_ALLOW_N_REGRESSION=1 as a measure-step env override only if you actually
# intend to publish the downgraded cell; a pure capacity-sweep fire is not
# expected to publish and can let that refusal stop it short of the PR step.
#
# a#7263 (a4z1 N-floor question): the cold and resume sample counts are ALSO
# fire-time substitutions now — _NATIVE_DIGEST_COLD_SAMPLES / _SUSPEND_RESUME_
# CYCLE_COUNT, both default "30" (byte-identical to the committed shape). A
# large warmpool fire also needs more scheduling headroom than the default
# 2-node cluster: gVisor pool pods are tiny (10m CPU / 16Mi mem each — CPU/mem
# is never the ceiling) but GKE's default max-pods-per-node (110) is, so pass
# _NUM_NODES/_MAX_NODES too once pool+claims approach ~200. _BUILD_TIMEOUT
# (default "3600s") caps the whole create->measure->render->PR->teardown
# lifecycle — raise it for a large resume-cycle fire (see the resume-cost
# warning at _SUSPEND_RESUME_CYCLE_COUNT's definition below: that loop is
# strictly sequential with no checkpointing, so cost scales ~linearly with N
# and a mid-run failure loses every accumulated sample). Example large fire:
#   gcloud builds triggers run hb-refresh-gke-sandbox --project=<PROJECT> \
#     --substitutions=_WARMPOOL_POOL_REPLICAS=200,_WARMPOOL_CLAIM_COUNT=266,_NUM_NODES=5,_MAX_NODES=7
#
# DEBUG ITERATION (hb#311): a `measure`-stage bug found via this trigger costs
# a full ~25min create+teardown fire per layer peeled (a prior 4-bug chain
# was 4 such fires — "fire-as-linter"). Set _KEEP_CLUSTER_ON_FAILURE=1 to skip
# the teardown trap on a FAILED measure step, leaving the cluster live for
# fast (~seconds-scale) iteration against it:
#   gcloud builds triggers run hb-refresh-gke-sandbox --project=<PROJECT> \
#     --substitutions=_KEEP_CLUSTER_ON_FAILURE=1,...
# A successful measure still always tears down regardless of this flag — it
# only defeats the trap on the failure path. Manual reap required afterward
# (the trap prints the exact `gcloud container clusters delete` command);
# leaving it set for a normal (non-debugging) refresh risks a leaked billed
# cluster on any transient failure, so the default is "0" (always teardown).
#
# WHAT IT DOES (unchanged from the workflow it replaces): provisions a FRESH,
# EPHEMERAL GKE node pool with the gVisor runtime (`--sandbox type=gvisor`),
# installs the SAME upstream controller from main as the kind path, fires the
# burst-create headline under runtimeClassName=gvisor, renders, runs public-safety
# fail-closed, and opens a PR with the result. The cluster is torn down via a bash
# EXIT trap — the CB-native equivalent of the workflow's `if: always()` teardown
# (Cloud Build has no always()-step; a trap in the orchestration step guarantees
# teardown on success, failure, OR timeout).
#
# Honest by construction (unchanged): a fresh node pool means an empty containerd
# cache (a genuine cold pull), the controller is the public upstream main image
# (no fork), and BENCH_CLUSTER_SUBSTRATE=gke-sandbox + BURST_CREATE_RUNTIME_CLASS=
# gvisor arm the burst-create read-back guard that refuses to publish a gke-sandbox
# cell unless every backing pod actually landed on the gvisor RuntimeClass.
#
# AUTH — NATIVE CB SERVICE ACCOUNT, NO WIF (the whole point of the migration).
# The three retired repo secrets (GCP_WIF_PROVIDER / GCP_SERVICE_ACCOUNT /
# GCP_PROJECT) are GONE: the build runs as a dedicated least-privilege SA passed
# on the trigger. That SA needs, on the target project:
#   - roles/container.admin        (create + delete the ephemeral cluster, kubectl)
#   - roles/iam.serviceAccountUser (act-as the node pool runtime SA on create)
#   - roles/compute.viewer         (cluster create reads network/subnet metadata)
# and Secret Accessor on the GitHub-token secret below. Project-specific SA +
# project values are kept OUT of this public file — see the parametrized
# scripts/setup-cloud-build-triggers.sh for the trigger-creation commands.
#
# REPRODUCIBLE BY ANYONE with a GCP project: point the setup script at your own
# project + SA + a GitHub token secret named hb-refresh-github-token.

substitutions:
  _POOL_REPLICAS: "10"       # burst size K (warm slots == claims fired)
  # Pinned to n2-standard-16 (PR#313 review) — the SAME class as the
  # persistent internal gVisor benchmark cluster (re-pooled to n2-standard-16 2026-06-30)
  # and the 07-04 warm-vs-cold baseline this refresh replaces. Regime continuity, past
  # and future: a burstable e2 class makes the North Star's <1s verdict hinge on host
  # noise rather than the substrate, and would permanently split the page's history
  # into two incomparable machine regimes. Cost is bounded (manual-fire-only, ~18min).
  _MACHINE_TYPE: "n2-standard-16"
  _REGION: "us-central1"
  _KEEP_CLUSTER_ON_FAILURE: "0"   # "1" = skip teardown trap on a FAILED measure step (hb#311)
  # hb#379: the warmpool_cold_start graduation-shape knobs (default = the committed
  # published shape, 30 resident / 40 fired — unchanged default behavior). Overridable
  # at fire time (--substitutions=_WARMPOOL_POOL_REPLICAS=10,_WARMPOOL_CLAIM_COUNT=...)
  # for a one-off empirical sweep of the pool's sustainable ceiling on this node shape,
  # without editing this file. A sweep value below 30 WILL trip check_n_regression on
  # publish — pass BENCH_ALLOW_N_REGRESSION=1 too (see harness/run.py) if the fire is a
  # deliberate diagnostic-only sweep you do not intend to merge, or just let public-safety/
  # the n-regression refusal stop it short of publishing (the pool-ready + node-count
  # diagnostics in the build log are the point of the sweep, not the published cell).
  _WARMPOOL_POOL_REPLICAS: "30"
  _WARMPOOL_CLAIM_COUNT: "40"
  # a#7263/a4z1: the cold and resume sample counts were the two graduation-shape
  # knobs left hardcoded in the measure-step env below instead of following the
  # warmpool pattern above — a fire wanting a bigger N had to edit this file.
  # Default "30" is byte-identical to the committed published shape; overridable
  # at fire time the same way as the warmpool knobs, e.g.:
  #   gcloud builds triggers run hb-refresh-gke-sandbox --project=<PROJECT> \
  #     --substitutions=_NATIVE_DIGEST_COLD_SAMPLES=200
  # Cold samples are cheap (~4s each measured 2026-08-25 — 200 samples costs
  # ~13min beyond baseline, well inside the default _BUILD_TIMEOUT below).
  # Resume cycles are NOT cheap the same way: suspend_resume.py's loop is
  # strictly sequential with each cycle chaining off the prior cycle's resumed
  # Pod, and results only finalize after the full loop completes (no
  # checkpointing) — a large _SUSPEND_RESUME_CYCLE_COUNT fire (e.g. the
  # 1376-class spec shape) needs a correspondingly larger _BUILD_TIMEOUT AND
  # accepts the risk that a mid-run failure loses every accumulated sample.
  # A below-30 value on either knob will trip check_n_regression on publish,
  # same as the warmpool knobs above.
  _NATIVE_DIGEST_COLD_SAMPLES: "30"
  _SUSPEND_RESUME_CYCLE_COUNT: "30"
  # Overridable ceiling for the overall create->measure->render->PR->teardown
  # lifecycle (hb#379 warmpool sweeps and the default 30/40/30/30 shape fit
  # comfortably inside 3600s; a large-N cold or resume sweep needs headroom).
  _BUILD_TIMEOUT: "3600s"
  # epic #6669 WS4: opt-in fork-source controller build. Default empty ⇒ the
  # measure step's fork block (scripts/cb-measure-gke-sandbox.sh) is INERT and
  # the standing daily fire installs the upstream prebuilt controller exactly as
  # before (this file is byte-identical in behavior when _HB_FORK_BUILD is empty).
  # Set _HB_FORK_BUILD=1 plus the five provenance inputs at fire time to build the
  # controller from a fork branch via ko and stamp
  # `fork@<sha> (+N fixes over upstream@<base>)` into results provenance:
  #   gcloud builds triggers run hb-refresh-gke-sandbox --project=<PROJECT> \
  #     --substitutions=_HB_FORK_BUILD=1,_HB_FORK_UPSTREAM_REPO=<owner/repo>,_HB_FORK_UPSTREAM_REF=<branch>,_HB_FORK_SHA=<sha>,_HB_FORK_BASE_UPSTREAM_SHA=<base-sha>,_HB_FORK_FIX_COUNT=<N>
  # For a deliberate diagnostic bisection fire (testing one historical upstream
  # commit with no fork fixes over it) also set _HB_FORK_ALLOW_DIAGNOSTIC=1,
  # since _HB_FORK_SHA/_HB_FORK_BASE_UPSTREAM_SHA will be identical and
  # _HB_FORK_FIX_COUNT will be 0 — the shape the guard below refuses by default.
  # Source-mode ko PUSHES the built image to the KO_DOCKER_REPO wired in the
  # measure step's env below, so the trigger SA needs roles/artifactregistry.writer
  # on that repo (prebuilt mode only pulls). Fail-closed: a requested fork build
  # with any required input missing aborts the measure step rather than silently
  # falling back to the upstream prebuilt (trust surface).
  _HB_FORK_BUILD: ""
  _HB_FORK_UPSTREAM_REPO: ""
  _HB_FORK_UPSTREAM_REF: ""
  _HB_FORK_SHA: ""
  _HB_FORK_BASE_UPSTREAM_SHA: ""
  _HB_FORK_FIX_COUNT: ""
  # hb#648/hb#650: cb-measure-gke-sandbox.sh refuses a fork-build dispatch whose
  # SHA/count inputs are self-referential (_HB_FORK_SHA == _HB_FORK_BASE_UPSTREAM_SHA)
  # or carry no staged fix (_HB_FORK_FIX_COUNT=0) — that shape is a bare
  # clean-upstream reproduction, not a validated fix pin, and hb#650 showed it
  # can open a real "auto-refresh headline" PR unreviewed. This override was
  # previously unwired here (script-only), so a deliberate diagnostic bisection
  # fire (e.g. testing a single historical upstream commit with no fork fixes)
  # had no way to pass the guard. Default empty ⇒ inert, same fail-closed
  # behavior as before this substitution existed.
  _HB_FORK_ALLOW_DIAGNOSTIC: ""
  # #6762 / hb#615 follow-up: ephemeral-cluster node floor. Default 2 preserves
  # the #6743 min-nodes=2 pre-scale fix (the standing daily fire is unchanged).
  # Override at fire time for the S27 controlled re-fire that varies node-count
  # ALONE (isolating the node-floor bump from a same-run controller-build change):
  #   gcloud builds triggers run hb-refresh-gke-sandbox --project=<PROJECT> \
  #     --substitutions=_NUM_NODES=1,_MAX_NODES=3   # then repeat with _NUM_NODES=2
  # _MAX_NODES empty ⇒ the script derives floor+1 (historical 2->3 headroom);
  # pin it so a clean single-variable fire holds max constant across both floors.
  _NUM_NODES: "2"
  _MAX_NODES: ""
  # hb#678: opt-in controller-image digest pin, for a deliberate batch of same-digest
  # replicate fires (tightening the warmpool-separation-verdict noise-floor estimate,
  # hb#675, without paying for N distinct-digest fires). Default empty ⇒ INERT — the
  # standing daily fire installs upstream's floating :latest-main tag exactly as before.
  # Not compatible with _HB_FORK_BUILD=1 (a fork build always builds a fresh image from
  # source; see scripts/cb-measure-gke-sandbox.sh's guard). Usage:
  #   gcloud builds triggers run hb-refresh-gke-sandbox --project=<PROJECT> \
  #     --substitutions=_HB_PIN_CONTROLLER_DIGEST=sha256:<64-hex>
  _HB_PIN_CONTROLLER_DIGEST: ""
  # hb#700: opt-in escape hatch for harness/run.py's check_cell_downgrade() trust-surface
  # guard. That guard fail-closes the WHOLE atomic latest.json write (every cell in the
  # fire, not just the regressed one) when a fresh measurement would downgrade a prior
  # GENUINE (non-pending) row — e.g. losing an sla_metrics key or a real outcome
  # regression. It fired correctly on hb#700's S29 Arm-B (n=4) fire #1: burst_create
  # measured 0/10 sub-1s TTFI claims at n=4 vs. a committed 3/10 at n=2 — a real,
  # non-buggy rig-shape effect, not a bug — and blocked publish of the unrelated
  # warmpool_gate_separation_ratio cell the fire actually needed. Default empty ⇒
  # INERT — the standing daily fire keeps today's fail-closed behavior exactly as
  # before this substitution existed. Override ONLY for a deliberate, understood,
  # documented republish (the rig-shape change is self-disclosing via run.py's existing
  # node_count/prior_node_count provenance stamp, so this is not a silent downgrade —
  # see hb#700 comments for the specific fire's root-cause writeup before setting this).
  # Usage:
  #     --substitutions=_ALLOW_CELL_DOWNGRADE=1
  _ALLOW_CELL_DOWNGRADE: ""

steps:
  # PRE-FIRE FUNCTIONAL PROBE: a policy READ (`gcloud projects get-iam-policy`)
  # can show `roles/logging.logWriter` bound to this trigger's SA and still be
  # wrong — a build (`3cfd8655`) once succeeded with ZERO step logs because
  # the grant hadn't finished PROPAGATING through IAM's enforcement layer
  # yet, even though a live policy read already showed it bound (the same
  # shape recurred as `68d8c424` days later on the same SA). A policy read
  # only proves the binding EXISTS, not that it has taken effect. This step
  # instead performs the actual FUNCTIONAL operation the whole build depends
  # on — write one real log entry via `gcloud logging write` — so a
  # propagation lag fails HERE, in seconds, before the ~25min ephemeral
  # gVisor cluster spend (create + gVisor pool + burst measure + teardown)
  # below, instead of silently producing a zero-log-lines build.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: preflight-logwriter-probe
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "==> pre-fire functional probe: writing a real log entry to confirm logWriter has actually propagated (not just a policy read)"
        gcloud logging write hb-refresh-preflight-probe \
          "hb-refresh-gke-sandbox pre-fire logWriter probe $(date -u +%FT%TZ)" \
          --severity=INFO --project=$PROJECT_ID
        echo "==> probe succeeded — logWriter is live; proceeding to the ~25min cluster spend"

  # Single orchestration step: create -> install -> measure -> render -> public-safety,
  # with an EXIT trap that tears the cluster down no matter how the step ends.
  # Everything through public-safety lives here so a failure anywhere still hits the
  # trap (leaked GKE clusters = ongoing spend — the one invariant that must hold).
  # The PR-open step runs only on success (CB skips later steps after a failure), by
  # which point the trap has already deleted the cluster.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: measure
    entrypoint: bash
    # HB_SDEV_WEBHOOK (same secret sdev-delta-notify posts through below) lets
    # the teardown trap below post an IMMEDIATE #s-dev alert on a failed
    # `clusters delete` -- see the cleanup() comment for why this exists.
    secretEnv: ['HB_SDEV_WEBHOOK']
    env:
      - "BENCH_CLUSTER_SUBSTRATE=gke-sandbox"
      # Stamp the rig (PR#313 review): this ephemeral CI cluster's machine
      # shape differs from the persistent internal cluster's (n2-standard-16) —
      # BENCH_MACHINE_TYPE lands it in provenance so the page is self-describing on a
      # machine-class change, not just a substrate label. Reads the same substitution the
      # cluster/node-pool create calls above use, so it can never drift from the actual rig.
      - "BENCH_MACHINE_TYPE=${_MACHINE_TYPE}"
      - "BURST_CREATE_RUNTIME_CLASS=gvisor"
      - "BURST_CREATE_POOL_REPLICAS=${_POOL_REPLICAS}"
      # Graduation-shape knobs (#198): the published warm/cold cells are n=30, and
      # each cell's n is scoped to these knobs (warm n = pool replicas, cold n =
      # cold samples; TTFE columns need BENCH_TTFE_EXEC). A refresh without them
      # would regress the graduated rows to n=5 / n=1 — which the harness now
      # refuses (check_n_regression). Canonical block: recipe/REPRODUCE.md,
      # "Refreshing published cells".
      - "WARMPOOL_COLD_START_RUNTIME_CLASS=gvisor"
      - "WARMPOOL_COLD_START_POOL_REPLICAS=${_WARMPOOL_POOL_REPLICAS}"
      - "WARMPOOL_COLD_START_CLAIM_COUNT=${_WARMPOOL_CLAIM_COUNT}"
      - "WARMPOOL_COLD_START_WARMUP_TIMEOUT_S=600"
      - "WARMPOOL_COLD_START_BIND_TIMEOUT_S=600"
      - "SUSPEND_RESUME_RUNTIME_CLASS=gvisor"
      # suspend_resume graduated to n=30 (#517) but its sample knob was missed
      # here — a refresh without it fires the scenario at its default n=1
      # (SUSPEND_RESUME_CYCLE_COUNT, harness/scenarios/suspend_resume.py) and the
      # all-or-nothing latest.json write reds on check_n_regression (hb#592).
      # a#7263: now substitution-backed (see _SUSPEND_RESUME_CYCLE_COUNT above)
      # so a larger-N fire no longer needs to edit this file.
      - "SUSPEND_RESUME_CYCLE_COUNT=${_SUSPEND_RESUME_CYCLE_COUNT}"
      - "NATIVE_DIGEST_COLD_RUNTIME_CLASS=gvisor"
      - "NATIVE_DIGEST_COLD_SAMPLES=${_NATIVE_DIGEST_COLD_SAMPLES}"
      - "BENCH_TTFE_EXEC=1"
      # NetworkPolicy data-plane probe (#3950/#3907): arm the in-Pod on-the-wire
      # enforcement probe so the two isolation cells (cross_tenant_network_isolation,
      # default_deny_egress) publish "enforced" BY CONSTRUCTION when the CNI actually
      # blocks the traffic — not a bare control-plane admission badge. Empirically
      # verified ENFORCED on the persistent internal cluster 2026-07-18 (both cells PASS
      # enforced/standard-np). Fail-safe: an inconclusive probe degrades to the
      # control-plane PASS, so a probe-infra hiccup can never red the refresh. The
      # cells build their OWN standard NetworkPolicy (bench-owned labels), never the
      # gke-sandbox managed-NP, so charter-#5 (#139) managed-NP disclosure does not
      # bind this arm.
      - "BENCH_NETPOL_DATAPLANE_PROBE=1"
      # Resource-limit-enforcement probe (#5634, completes the #3868 footprint
      # axis): arm the controlled-overshoot confinement probe so the
      # resource_limit_enforcement cell publishes "enforced" BY CONSTRUCTION —
      # the sandbox's OWN command allocates a fixed 256Mi against a declared 64Mi
      # limit, and a cgroup OOM-kill (reason=OOMKilled / exit 137) is the single
      # K8s-API-observable PASS signal (256Mi << node memory, so exit 137 can only
      # be a cgroup kill, never a node-OOM). Fail-safe: an inconclusive probe
      # degrades to pending(overshoot-inconclusive), so a probe-infra hiccup can
      # never red the refresh. The cell allocates from its own declared footprint
      # and reads only the terminal container state off the K8s API — no in-sandbox
      # cgroup read, no managed-runtime disclosure, so charter-#5 does not bind it.
      - "BENCH_RLIMIT_OVERSHOOT_PROBE=1"
      # Consumed by scripts/cb-measure-gke-sandbox.sh below. The step's script
      # used to live inline here and dereference ${_REGION} /
      # ${_KEEP_CLUSTER_ON_FAILURE} directly via CB's substitution engine —
      # that engine only scans YAML text, not a checked-in file the step
      # merely invokes, so once the script moved to its own file these two
      # substitutions have to be handed across as plain env vars instead
      # (BENCH_MACHINE_TYPE above already carries ${_MACHINE_TYPE} the same
      # way, and the script reuses it rather than adding a third copy).
      - "HB_REGION=${_REGION}"
      - "HB_KEEP_CLUSTER_ON_FAILURE=${_KEEP_CLUSTER_ON_FAILURE}"
      # #6762 / hb#615: ephemeral-cluster node floor + headroom, same env-handoff
      # reason as HB_REGION above (CB substitutions can't be read inline from a
      # checked-in script). Default _NUM_NODES=2 / _MAX_NODES="" preserves 2/2/3.
      - "HB_NUM_NODES=${_NUM_NODES}"
      - "HB_MAX_NODES=${_MAX_NODES}"
      # epic #6669 WS4 fork-build inputs (see the substitutions block above). All
      # empty by default ⇒ the fork block in cb-measure-gke-sandbox.sh is skipped
      # and this env is inert. HB_FORK_KO_DOCKER_REPO is the ko push target;
      # $PROJECT_ID is a CB built-in resolved at build time, so no concrete project
      # id ships in this public file (same technique the availableSecrets block
      # below already uses). It reuses the _REGION substitution above so the push
      # target can never drift from the cluster region.
      # The target MUST be a full 4-component AR image ref
      # (HOST/PROJECT/REPOSITORY/IMAGE) because install-controller-from-main.sh
      # runs `ko build --bare`, which publishes to *exactly* KO_DOCKER_REPO with no
      # appended suffix. A 3-component `.../honest-bench` (repo only, no image name)
      # makes AR reject the push with `NAME_INVALID: Missing image name` — that was
      # the 3rd WS4 red (go+ko installed, controller compiled, then the publish
      # failed). `agent-sandbox-controller` is the image name under the honest-bench
      # AR repo (matches the built binary; same repo the webhook image lives under).
      - "HB_FORK_BUILD=${_HB_FORK_BUILD}"
      - "HB_FORK_UPSTREAM_REPO=${_HB_FORK_UPSTREAM_REPO}"
      - "HB_FORK_UPSTREAM_REF=${_HB_FORK_UPSTREAM_REF}"
      - "HB_FORK_KO_DOCKER_REPO=${_REGION}-docker.pkg.dev/${PROJECT_ID}/honest-bench/agent-sandbox-controller"
      - "HB_FORK_SHA=${_HB_FORK_SHA}"
      - "HB_FORK_BASE_UPSTREAM_SHA=${_HB_FORK_BASE_UPSTREAM_SHA}"
      - "HB_FORK_FIX_COUNT=${_HB_FORK_FIX_COUNT}"
      - "HB_FORK_ALLOW_DIAGNOSTIC=${_HB_FORK_ALLOW_DIAGNOSTIC}"
      - "HB_PIN_CONTROLLER_DIGEST=${_HB_PIN_CONTROLLER_DIGEST}"
      # hb#700: direct pass-through, no script-side translation needed — harness/run.py
      # reads BENCH_ALLOW_CELL_DOWNGRADE from the environment by this exact name (see
      # the _ALLOW_CELL_DOWNGRADE substitution comment above for the guard/rationale),
      # and this CB step's env: already exports straight into the container that runs
      # `python3 -m harness.run` below — same mechanism the other BENCH_* passthroughs
      # (e.g. BENCH_NODE_COUNT, set later in cb-measure-gke-sandbox.sh itself) rely on.
      - "BENCH_ALLOW_CELL_DOWNGRADE=${_ALLOW_CELL_DOWNGRADE}"
    args:
      - scripts/cb-measure-gke-sandbox.sh

  # Open the refresh PR — runs only if `measure` succeeded (so the cluster is
  # already torn down and the rendered diff is on disk in /workspace). Uses a
  # narrow-scope GitHub token from Secret Manager (contents:write +
  # pull-requests:write on honest-bench) instead of the workflow's ambient
  # GITHUB_TOKEN. peter-evans/create-pull-request is replaced by plain git push +
  # a REST call to the pulls API. The commit identity is a non-personal automation
  # handle (no dot-TLD, so no address ships in this public file).
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: open-pr
    entrypoint: bash
    secretEnv: ['GITHUB_TOKEN']
    args:
      - -c
      - |
        set -euo pipefail

        # Freshness self-declaration: advance the stamp BEFORE the skip-guard so EVERY
        # fire re-anchors it. verify-upstream-freshness.py --update-stamp cross-checks
        # every upstream ref live and, on a fully-fresh run, bumps _meta.last_verified
        # (calendar-age banner) AND recomputes _meta.commit_distance (commits-behind-
        # upstream banner) in one write, then re-renders README/DETAILS/WORK_IN_PROGRESS
        # so the byte-pinned golden stays self-consistent (render/test_readme_fresh.py).
        # Runs AFTER the measure step, so it reads the fresh latest.json provenance
        # (fork_base_upstream_sha), and inherits GITHUB_TOKEN from secretEnv for public-
        # read rate headroom (the script works unauthenticated too). It is FAIL-CLOSED:
        # on drift (exit 1) or an unreachable/unmeasurable upstream (exit 2) it writes
        # NOTHING partial. Best-effort here — a non-fresh cross-check must never red the
        # fire: the benchmark numbers still publish with the last-known-good stamp, and
        # the commit-distance banner self-declares "UNVERIFIED" loudly on its own.
        if python3 scripts/verify-upstream-freshness.py --update-stamp; then
          echo "freshness stamp advanced + pages re-rendered (last_verified + commit_distance)."
        else
          echo "--update-stamp non-fresh or upstream unreachable — publishing numbers with the existing stamp; fail-closed, no partial write."
        fi

        # No result change -> nothing to PR (parity with peter-evans's no-op skip).
        # render/upstream_links.json is in the skip-guard + git-add lists below so a
        # freshness-only re-anchor (numbers unchanged, stamp bumped by --update-stamp
        # above) still publishes — otherwise the committed last_verified would lag the
        # actual fire and the "numbers <=72h old, self-declared" contract would rot.
        # history.jsonl (hb#3918/hb#439) included: a build-over-build accrual can land a
        # new/refreshed row with README/DETAILS otherwise unchanged (e.g. the COUNT is
        # identical to the prior build but the digest/date differ) — without it here that
        # accrual would silently never publish.
        # warmpool-separation-history.jsonl (#6890 item 3) included for the identical
        # reason as history.jsonl above: the measure step's `accrue_warmpool_separation`
        # call appends a row here, and generate.py bakes that row into DETAILS.md's
        # "Same-build separation-ratio variance" sparkline BEFORE this commit — omitting
        # it from this list let the rendered sparkline diverge from a reproducible
        # `python3 -m render.generate` (render/test_readme_fresh.py caught it: a PR's
        # committed DETAILS.md carried a row this file never got the chance to commit).
        if git diff --quiet -- sandbox/results/latest.json sandbox/results/history.jsonl sandbox/results/warmpool-separation-history.jsonl README.md DETAILS.md render/upstream_links.json; then
          echo "No benchmark diff to publish — skipping PR."
          exit 0
        fi

        # $$ escapes CB's substitution engine so GITHUB_TOKEN is read at runtime from
        # secretEnv, not as a build substitution at submit time (the #1474 foot-gun;
        # the engine scans the whole step string, comments included — avoid the
        # single-dollar-brace form even here).
        git config --global url."https://x-access-token:$${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
        git config --global user.name "honest-bench-refresh"
        git config --global user.email "refresh@localhost"

        # epic #6669 WS3/WS4: route the staging branch by fire flavor so an
        # upstream refresh never force-pushes over a pending fork-build PR (and
        # vice-versa). A branch here is a STAGING LANE, not the public headline —
        # the headline is whichever PR is reviewed and merged — so two lanes let
        # the latest-upstream and fork headlines both stay open for review at once
        # (epic goal 2: publish both). Fork fires keep the ORIGINAL branch so the
        # in-flight WS4 PR #594 is preserved; upstream/default fires get their
        # own lane. _HB_FORK_BUILD is "" (upstream) or "1" (fork) and inlines at
        # submit time (non-secret substitution — the $$-escape / runtime-read
        # discipline the GITHUB_TOKEN comment above describes applies to secrets,
        # not to this plain flag).
        if [ -n "${_HB_FORK_BUILD}" ]; then
          # Fork lane: keep ONE stable branch across fires on purpose, so
          # iterative WS4 fixes (epic #6669) land as updates to the SAME
          # in-flight PR (#594) instead of each fire opening a new one. This
          # lane still needs the force-with-lease dance below because it IS
          # meant to overwrite its own prior push.
          BRANCH="auto/refresh-gke-sandbox"
          FLAVOR="fork-build"
          PUSH_FORCE="1"
        else
          # hb#682 fix: the standing daily upstream lane gets a UNIQUE branch
          # per fire (suffixed with the Cloud Build id) instead of the old
          # shared "auto/refresh-gke-sandbox-upstream" branch. The prior
          # scheme rebuilt that branch from a fresh clone of `main` on EVERY
          # fire, then force-pushed over whatever it already held — a fresh
          # clone never round-trips through a still-open PR, so a fire that
          # outpaced review silently erased a predecessor's still-unmerged
          # row (history.jsonl / warmpool-separation-history.jsonl are both
          # append-only stores in the file list below). Per-fire branches
          # remove the shared mutable push target entirely: no fire's branch
          # is ever the destination of a LATER fire's push, so a
          # predecessor's unmerged PR is untouched no matter how many fires
          # land before it gets reviewed. The tradeoff — multiple open
          # refresh PRs can pile up if review lags, and a late one may hit a
          # real merge conflict against an earlier one — is the CORRECT
          # failure mode here: a loud, visible merge conflict beats a silent
          # drop (the fleet's trust-surface fail-closed idiom). $BUILD_ID is
          # a Cloud Build built-in substitution, unescaped like $PROJECT_ID
          # elsewhere in this file, resolved at submit time.
          BRANCH="auto/refresh-gke-sandbox-upstream-$BUILD_ID"
          FLAVOR="latest-upstream"
          PUSH_FORCE=""
        fi
        git checkout -b "$$BRANCH"
        git add sandbox/results/latest.json sandbox/results/history.jsonl sandbox/results/warmpool-separation-history.jsonl README.md DETAILS.md render/upstream_links.json
        git commit -m "data: auto-refresh benchmark results (substrate=gke-sandbox, gVisor, $$FLAVOR)"

        if [ -n "$$PUSH_FORCE" ]; then
          # A fresh CB clone fetches only main, so it has no remote-tracking ref for
          # origin/BRANCH — and `--force-with-lease` with no explicit expected value
          # uses refs/remotes/origin/BRANCH as its lease baseline. Without it, the 2nd
          # refresh onward is rejected ("stale info") because git has no baseline to
          # compare. Establish the ref first: force-update the remote-tracking ref to the
          # current remote tip so the lease is accurate. Tolerated no-op on the very first
          # refresh (branch does not yet exist remotely). Preserves the force-with-lease
          # safety semantics (still refuses to clobber an unseen concurrent update).
          git fetch origin "+$$BRANCH:refs/remotes/origin/$$BRANCH" 2>/dev/null || true
          git push --force-with-lease origin "$$BRANCH"
        else
          # BRANCH is unique to this fire — there is no existing remote ref to
          # clobber, so a plain push is correct (and a force flag here would
          # only ever mask a real bug, never legitimately fire).
          git push origin "$$BRANCH"
        fi

        # Open the PR. For the fork lane (shared branch, PUSH_FORCE=1) an
        # existing open PR on that branch already got the push above folded
        # into it — detect that and skip re-creating. For the upstream lane
        # BRANCH is unique per fire, so this lookup is expected to always
        # come back empty; kept as a cheap, harmless defensive no-op. Body
        # kept single-line to avoid JSON newline handling in the shell.
        BODY="Automated gke-sandbox (gVisor) benchmark refresh from a manual Cloud Build dispatch. substrate: gke-sandbox (fresh ephemeral node pool with --sandbox type=gvisor); burst fired under runtimeClassName=gvisor (burst-create read-back guard confirmed every backing pod landed on the gvisor RuntimeClass); results regenerated from sandbox/results/latest.json; public-safety scanner passed (fail-closed gate before this PR opened). Review the headline change before merge."
        api="https://api.github.com/repos/AlexBulankou/honest-bench/pulls"
        existing=$(curl -sS -H "Authorization: Bearer $${GITHUB_TOKEN}" \
          "$api?head=AlexBulankou:$$BRANCH&state=open")
        # Capture the PR's html_url either way (existing or freshly-opened) so the
        # sdev-delta-notify step below can link it — written unconditionally on both branches.
        existing_url=$(echo "$existing" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d[0]["html_url"] if d else "")')
        if [ -n "$existing_url" ]; then
          echo "A PR for $$BRANCH is already open — pushed the update to it."
          echo "$existing_url" > /workspace/pr_url.txt
          exit 0
        fi
        payload=$(python3 -c 'import json,sys; print(json.dumps({"title":"data: auto-refresh gke-sandbox (gVisor) benchmark headline ["+sys.argv[3]+"]","head":sys.argv[1],"base":"main","body":sys.argv[2]}))' "$$BRANCH" "$$BODY" "$$FLAVOR")
        pr_response=$(curl -sS -X POST -H "Authorization: Bearer $${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" "$api" -d "$payload")
        echo "$pr_response"
        echo "$pr_response" | python3 -c 'import sys,json; print(json.load(sys.stdin)["html_url"])' > /workspace/pr_url.txt

  # hb#690: the upstream lane's per-fire-unique-branch fix (hb#682/#688) is
  # correct on its own terms -- a shared mutable branch was silently erasing
  # unmerged rows -- but the trade-off is these per-fire branches never get
  # cleaned up once their PR merges (repo has delete_branch_on_merge: false),
  # so they accumulate as op-noise. This step is the cleanup half of that
  # trade-off: it sweeps ONLY the unique-per-fire naming pattern
  # (auto/refresh-gke-sandbox-upstream-*) and deletes a branch iff GitHub
  # confirms an associated PR has actually MERGED -- an open or
  # closed-without-merging PR is left alone. The fork lane's persistent
  # shared branch (auto/refresh-gke-sandbox, no "-upstream-" suffix) can
  # never match this prefix, so this step structurally cannot touch it --
  # deleting that branch would break the "keep ONE stable branch across
  # fires" design the fork lane exists for (WS4 PR #594 continuity).
  # Best-effort / never fails the build: this is hygiene, not correctness --
  # a missed sweep this fire just means the branch waits for the next one.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: cleanup-merged-branches
    waitFor: ['open-pr']
    entrypoint: bash
    secretEnv: ['GITHUB_TOKEN']
    args:
      - -c
      - |
        set -uo pipefail
        api="https://api.github.com/repos/AlexBulankou/honest-bench"
        prefix="auto/refresh-gke-sandbox-upstream-"

        # The repo has grown past 100 branches, so a single per_page=100 page
        # can silently miss matches sorted onto page 2+ (hb#690 live-fire
        # bug: the two live auto/refresh-gke-sandbox-upstream-* branches both
        # sorted onto page 2 while page 1 filled with 100 alphabetically
        # earlier branches). Page through every branch before filtering.
        branches=$(page=1; while :; do
          resp=$(curl -sS -H "Authorization: Bearer $${GITHUB_TOKEN}" \
            "$api/branches?per_page=100&page=$${page}")
          names=$(echo "$resp" | python3 -c 'import sys,json; d=json.load(sys.stdin); [print(b["name"]) for b in d]')
          [ -z "$names" ] && break
          echo "$names"
          page=$((page + 1))
        done | grep "^$${prefix}" || true)

        if [ -z "$branches" ]; then
          echo "No $${prefix}* branches found -- nothing to sweep."
          exit 0
        fi

        while IFS= read -r branch; do
          [ -z "$branch" ] && continue
          closed=$(curl -sS -H "Authorization: Bearer $${GITHUB_TOKEN}" \
            "$api/pulls?head=AlexBulankou:$branch&state=closed")
          # List-pulls items carry merged_at (null until merged), NOT the
          # boolean `merged` field -- that only exists on the single-PR GET.
          # `d[0].get("merged")` is always None here, so the sweep was
          # deterministically inert (hb#690 live-fire finding).
          merged=$(echo "$closed" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("1" if d and d[0].get("merged_at") else "0")')
          if [ "$merged" = "1" ]; then
            del_status=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $${GITHUB_TOKEN}" \
              "$api/git/refs/heads/$branch")
            echo "deleted merged branch $branch (HTTP $del_status)"
          else
            echo "skipping $branch -- no merged PR found (still open or unmerged)"
          fi
        done <<< "$branches"

  # hb#346 added the in-page "Refresh delta" caveat (_north_star_delta_caveat in
  # render/render.py) but that's passive — someone has to open the README to see it.
  # This step pushes the SAME flag proactively to a Google Chat room at publish time,
  # so a >=NORTH_STAR_DELTA_FACTOR swing or a pass/fail verdict flip is surfaced the
  # moment it's measured, not discovered days later by whoever next happens to open
  # the rendered page.
  #
  # Runs only if open-pr actually opened/updated a PR this fire (pr_url.txt present —
  # absent on the "no diff to publish" no-op). Reuses _north_star_delta_caveat directly
  # (imported, not reimplemented) so the proactive post can never drift from the
  # in-page annotation's threshold logic. No-op (exit 0, no post) when the caveat is
  # empty — most refreshes don't cross the flag threshold.
  - name: python:3.12-slim
    id: sdev-delta-notify
    waitFor: ['open-pr']
    entrypoint: bash
    secretEnv: ['HB_SDEV_WEBHOOK']
    args:
      - -c
      - |
        set -euo pipefail
        if [ ! -f /workspace/pr_url.txt ]; then
          echo "No PR opened this run — nothing to notify."
          exit 0
        fi
        PR_URL=$$(cat /workspace/pr_url.txt)
        cd /workspace
        PR_URL="$$PR_URL" python3 <<'PYEOF'
        import importlib.util
        import json
        import os
        import sys
        import urllib.request

        # render.py is loaded by explicit file path (same technique render/generate.py
        # uses) because it does a flat `from schema import ...` that only resolves with
        # render/ itself on sys.path — a dotted `from render.render import ...` would hit
        # the render/-directory-shadows-render.py namespace-package trap documented in
        # generate.py's own import note. The sys.path insert below is what makes that
        # flat `from schema import ...` resolve during exec_module, mirroring generate.py.
        sys.path.insert(0, "/workspace/render")
        _spec = importlib.util.spec_from_file_location("_bench_render", "/workspace/render/render.py")
        _render = importlib.util.module_from_spec(_spec)
        _spec.loader.exec_module(_render)

        with open("sandbox/results/latest.json") as fh:
            results = json.load(fh)

        # Mirror generate.py's own kata_results load (generate.py:190-194) so this
        # step evaluates the SAME two-arg call the in-page render does. A one-arg
        # call would silently drop the Kata rows from _north_star_rows and miss a
        # Kata-only p95 swing or verdict flip — exactly the drift this step exists
        # to prevent. Graceful-degrade to None when the Kata companion is absent,
        # same as generate.py.
        kata_results = None
        kata_path = "sandbox-kata/results/latest.json"
        if os.path.exists(kata_path):
            with open(kata_path) as fh:
                kata_results = json.load(fh)

        caveat = _render._north_star_delta_caveat(results, kata_results)
        if not caveat:
            print("No refresh-delta flag triggered — nothing to notify.")
            raise SystemExit(0)

        pr_url = os.environ["PR_URL"]
        webhook = os.environ["HB_SDEV_WEBHOOK"]
        text = caveat + "\n\nResults PR: " + pr_url
        body = json.dumps({"text": text}).encode()
        req = urllib.request.Request(
            webhook, data=body, headers={"Content-Type": "application/json"}
        )
        # Best-effort: a webhook 4xx/5xx/timeout must never fail this step, since
        # open-pr already published the real work by the time this runs — mirrors
        # the creds-refresh doctrine ("both notify steps are best-effort — failure
        # of either never breaks the actual cred refresh").
        try:
            urllib.request.urlopen(req, timeout=15)
            print("Posted refresh-delta tripwire to #s-dev.")
        except Exception as exc:
            print("WARNING: refresh-delta chat post failed (non-fatal): %s" % exc)
        PYEOF

availableSecrets:
  secretManager:
    # $PROJECT_ID is a Cloud Build built-in substitution resolved at build time, so
    # the concrete project id never ships in this public file. Provision a narrow
    # GitHub token (contents:write + pull-requests:write on AlexBulankou/honest-bench)
    # as Secret Manager secret `hb-refresh-github-token`. The unit-tests trigger
    # needs no secret (read-only offline run).
    - versionName: projects/$PROJECT_ID/secrets/hb-refresh-github-token/versions/latest
      env: GITHUB_TOKEN
    # Incoming Google Chat webhook (see the PR description for provisioning detail).
    # Consumed via secretEnv by two steps -- sdev-delta-notify's threshold alert and
    # measure's teardown-failure alert -- never a build substitution, so it never
    # echoes into build logs.
    - versionName: projects/$PROJECT_ID/secrets/hb-sdev-webhook/versions/latest
      env: HB_SDEV_WEBHOOK

options:
  logging: CLOUD_LOGGING_ONLY

# gVisor node pool create (~5-8 min) + burst measure + the n=30 graduation-shape
# warm/cold cells (#198: 30-member pool warmup + 40 claims + 30 serial cold
# samples, ~8-10 min extra) + teardown fits under 60 min.
timeout: ${_BUILD_TIMEOUT}
